{% extends "base.html" %}

{% block title %}Error {{ code }}{% endblock %}
{% block breadcrumb %}SECURITY ALERT // HTTP {{ code }}{% endblock %}

{% block content %}
<div class="hud-card hud-bracketed" style="text-align: center; max-width: 540px; margin: 40px auto; padding: 48px 24px;">
    <div style="width: 64px; height: 64px; background: rgba(244, 63, 94, 0.1); border: 1px solid var(--cyber-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 16px;">
        🛡️
    </div>

    <div style="font-family: var(--font-mono); font-size: 0.82rem; color: var(--cyber-red); letter-spacing: 1px; margin-bottom: 6px;">
        SECURITY BOUNDARY EXCEPTION
    </div>

    <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 8px;">
        {{ code }} - {{ title }}
    </h2>

    <p style="color: var(--text-secondary); margin-bottom: 28px; font-size: 0.95rem;">
        {{ description }}
    </p>

    <a href="/" class="cyber-btn cyber-btn-primary">
        RETURN TO OPERATIONS &rarr;
    </a>
</div>
{% endblock %}
